spring.application.name=sensor-cache-lab
server.port=8080

# Perfil por defecto: dev (activa el filtro CORS). En producción: --spring.profiles.active=prod
spring.profiles.default=dev

# --- Base de datos: H2 en memoria. Se recrea y se rellena en cada arranque,
#     así el repositorio no necesita versionar ningún archivo de datos. ---
spring.datasource.url=jdbc:h2:mem:sensorlab;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Datos sintéticos: 12 estaciones x N lecturas horarias ---
lab.seed.readings-per-station=30000

# --- CORS (solo perfil dev): orígenes donde se sirve el front ---
lab.cors.origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500
server.error.include-message=always
